services:
  # ==========================================
  # Backend API Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - chatbot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # Frontend Client (Nginx Reverse Proxy)
  # ==========================================
  frontend:
    build:
      context: ./frontend/chatgpt
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: chatbot_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - chatbot_network

  # ==========================================
  # Optional: Local MongoDB (For offline setup)
  # Activate with: docker compose --profile with-mongo up
  # ==========================================
  mongodb:
    image: mongo:7-jammy
    container_name: chatbot_mongodb
    restart: unless-stopped
    profiles:
      - with-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=chatbot
    volumes:
      - mongo_data:/data/db
    networks:
      - chatbot_network

networks:
  chatbot_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local

